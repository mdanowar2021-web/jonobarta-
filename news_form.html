
{% extends "base.html" %}{% block title %}{{'Edit' if item else 'New'}} News | JonoBarta{% endblock %}
{% block content %}<div class="container admin"><div class="adminbar"><h1>{{'নিউজ Edit' if item else 'নতুন নিউজ প্রকাশ'}}</h1><a class="btn" href="{{url_for('dashboard')}}">← Dashboard</a></div>
<form class="panel form" method="post" enctype="multipart/form-data"><label>শিরোনাম<input name="title" value="{{item.title if item else ''}}" required></label><label>সংক্ষিপ্ত বিবরণ<textarea name="summary" rows="3">{{item.summary if item else ''}}</textarea></label><label>বিস্তারিত নিউজ<textarea name="body" rows="14" required>{{item.body if item else ''}}</textarea></label><div class="two"><label>রিপোর্টারের নাম<input name="reporter" value="{{item.reporter if item else ''}}"></label><label>নিউজ বিভাগ<input name="category" placeholder="জাতীয় / রাজনীতি / খেলাধুলা..." value="{{item.category if item else ''}}"></label></div><label>ছবি আপলোড<input type="file" name="image" accept="image/*"></label>
<div class="checks"><label><input type="checkbox" name="featured" {% if item and item.featured %}checked{% endif %}> ⭐ Featured News</label><label><input type="checkbox" name="breaking" {% if item and item.breaking %}checked{% endif %}> 🔴 Breaking News</label></div>
<label>Status<select name="status"><option value="published" {% if not item or item.status=='published' %}selected{% endif %}>Published</option><option value="draft" {% if item and item.status=='draft' %}selected{% endif %}>Draft</option></select></label>
<button class="primary">{{'Update News' if item else 'Publish News'}}</button></form></div>{% endblock %}
