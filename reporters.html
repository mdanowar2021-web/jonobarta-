
{% extends "base.html" %}{% block title %}Reporter Management | JonoBarta{% endblock %}
{% block content %}<div class="container admin"><div class="adminbar"><h1>👤 Reporter ID Card</h1><a class="btn" href="{{url_for('dashboard')}}">Dashboard</a></div>
<form class="panel form" method="post" enctype="multipart/form-data"><h2>নতুন Reporter</h2><div class="two"><label>Reporter ID<input name="reporter_id" placeholder="JB-10011"></label><label>নাম<input name="name" required></label><label>পদবি<input name="designation" value="Multimedia Reporter"></label><label>রক্তের গ্রুপ<input name="blood_group" placeholder="B+"></label><label>ফোন<input name="phone"></label><label>যোগদানের তারিখ<input type="date" name="joined"></label><label>মেয়াদ শেষ<input type="date" name="valid_until"></label><label>ছবি<input type="file" name="photo" accept="image/*"></label></div><label>ঠিকানা<textarea name="address" rows="2"></textarea></label><button class="primary">＋ Add Reporter</button></form>
<div class="panel tablewrap"><table><tr><th>ID</th><th>Name</th><th>Designation</th><th>Action</th></tr>{% for r in reps %}<tr><td>{{r.reporter_id}}</td><td>{{r.name}}</td><td>{{r.designation}}</td><td><a target="_blank" href="{{url_for('reporter_card',rid=r.id)}}">🪪 Card</a> · <form class="inline" method="post" action="{{url_for('reporter_delete',rid=r.id)}}" onsubmit="return confirm('Delete?')"><button>🗑️</button></form></td></tr>{% endfor %}</table></div></div>{% endblock %}
